<!-- ============================================================
     DriverRiwayat.html : markup + CSS halaman Riwayat Perjalanan
     Filter bulan/tahun, ringkasan (total perjalanan, total jarak, rata-rata durasi), daftar perjalanan selesai dikelompokkan per tanggal.
     Dipasang di DriverApp.html dalam section h-riwayat. Logikanya ada di DriverRiwayatJS.html.
     CSS memakai awalan rw- agar tidak bentrok dengan fitur lain.
     ============================================================ -->
<style>
#h-riwayat{display:grid;gap:20px;align-content:start;grid-template-columns:minmax(0,1fr)}
.rw-kepala{display:flex;gap:12px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.rw-kepala h2{font-size:22px;letter-spacing:-.01em}
.rw-kepala p{color:var(--abu);margin-top:2px}
.rw-filter{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.rw-filter select{border:1px solid var(--garis);background:#fff;color:var(--teks);font:inherit;font-weight:600;border-radius:10px;padding:9px 12px;cursor:pointer}
.rw-filter select:focus-visible{outline:3px solid var(--biru);outline-offset:1px}
.rw-segar{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--garis);background:#fff;color:var(--biru);font-weight:700;border-radius:10px;padding:9px 14px;cursor:pointer;transition:.15s}
.rw-segar:hover{border-color:var(--biru)}
.rw-segar.putar svg.i{animation:rw-putar .8s linear infinite}
@keyframes rw-putar{to{transform:rotate(360deg)}}

/* ---- Ringkasan ---- */
.rw-ringkas{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.rw-ringkas>div{background:#fff;border:1px solid var(--garis);border-radius:16px;padding:16px 18px;box-shadow:0 2px 10px rgba(15,27,45,.04)}
.rw-ringkas>div:first-child{background:linear-gradient(135deg,var(--kuning),#FFD000);border-color:#F2D400}
.rw-ringkas small{display:block;color:var(--abu);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.rw-ringkas>div:first-child small{color:#5B4A00}
.rw-ringkas b{display:block;font-size:26px;letter-spacing:-.01em;margin-top:2px;color:var(--navy)}
.rw-ringkas b span{font-size:13px;font-weight:600;color:var(--abu);margin-left:4px}
.rw-ringkas>div:first-child b span{color:#5B4A00}

/* ---- Daftar ---- */
#rw-isi{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
.rw-grup{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
.rw-grup-judul{display:flex;align-items:center;gap:10px;font-weight:800;color:var(--navy);margin-top:6px}
.rw-grup-judul::after{content:"";flex:1;height:1px;background:var(--garis)}
.rw-item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;background:#fff;border:1px solid var(--garis);border-radius:16px;padding:14px 18px;cursor:pointer;transition:.15s;animation:rw-masuk .3s both}
.rw-item:hover{border-color:var(--biru);box-shadow:0 6px 18px rgba(11,95,138,.10);transform:translateY(-1px)}
.rw-item:focus-visible{outline:3px solid var(--biru);outline-offset:2px}
@keyframes rw-masuk{from{opacity:0;transform:translateY(6px)}}
.rw-jam{width:128px;text-align:center;background:var(--panel);border-radius:12px;padding:8px 10px;color:var(--navy)}
.rw-jam b{display:block;font-size:15px}
.rw-jam small{display:block;color:var(--abu);font-size:11px;margin-top:1px}
.rw-judul{font-weight:800;font-size:15px;line-height:1.3}
.rw-ket{color:var(--abu);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rw-chip{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.rw-chip span{display:inline-flex;gap:5px;align-items:center;background:#F1F5F9;color:#334155;border-radius:99px;padding:4px 10px;font-size:12px;font-weight:600}
.rw-chip span.km{background:#DCFCE7;color:#14532D}
.rw-chip span.cat{background:#FEF3C7;color:#92400E}
.rw-chip svg.i{width:13px;height:13px}
.rw-kanan{color:var(--abu)}
.rw-lagi{justify-self:center}

.rw-kosong{background:#fff;border:1px dashed #CBD5E1;border-radius:18px;padding:44px 16px;text-align:center;color:var(--abu)}
.rw-kosong>svg.i{width:38px;height:38px;stroke-width:1.5;display:block;margin:0 auto 8px}
.rw-kosong b{display:block;color:var(--teks);font-size:16px;margin-bottom:2px}
.rw-kosong .btn{margin-top:14px}

@media (max-width:700px){
  .rw-ringkas{grid-template-columns:repeat(2,minmax(0,1fr))}
  .rw-ringkas>div{min-width:0}
  .rw-filter select{min-width:0}
  .rw-ringkas>div:first-child{grid-column:1/-1}
  .rw-item{grid-template-columns:minmax(0,1fr) auto;gap:10px}
  .rw-jam{width:auto;grid-column:1/-1;display:flex;gap:8px;justify-content:center;align-items:baseline;text-align:left}
  .rw-filter{width:100%}
  .rw-filter select{flex:1}
}

/* ---- Desain baru: banner halaman (gaya sama dengan Profil) ---- */
.rw-kepala{position:relative;overflow:hidden;display:flex;gap:18px;justify-content:space-between;align-items:center;flex-wrap:wrap;color:#fff;border-radius:22px;padding:26px 30px;margin-bottom:20px;background:linear-gradient(120deg,var(--navy) 0%,#0B6A8F 68%,#12839F 100%);box-shadow:0 12px 32px rgba(10,61,92,.22);animation:rw-masuk .4s both}
.rw-kepala::before{content:"";position:absolute;right:-60px;top:-90px;width:260px;height:260px;border-radius:50%;background:rgba(255,230,0,.17);pointer-events:none}
.rw-kepala::after{content:"";position:absolute;left:42%;bottom:-120px;width:210px;height:210px;border-radius:50%;background:rgba(255,255,255,.07);pointer-events:none}
.rw-kepala>*{position:relative;z-index:1}
.rw-kepala>div:first-child{display:flex;gap:16px;align-items:center;min-width:0}
.rw-kepala .bn-ik{flex:none;width:54px;height:54px;border-radius:16px;background:var(--kuning);color:var(--navy);display:grid;place-items:center;box-shadow:0 0 0 4px rgba(255,255,255,.22)}
.rw-kepala .bn-ik svg.i{width:26px;height:26px}
.rw-kepala h2{color:#fff;font-size:26px;font-weight:800;letter-spacing:-.01em;line-height:1.15}
.rw-kepala p{color:rgba(255,255,255,.85);margin-top:4px}
.rw-segar{background:rgba(255,255,255,.14)!important;border:1px solid rgba(255,255,255,.38)!important;color:#fff!important;backdrop-filter:blur(6px);transition:.15s}
.rw-segar:hover{background:rgba(255,255,255,.26)!important}
@keyframes rw-masuk{from{opacity:0;transform:translateY(10px)}}
@media (max-width:560px){.rw-kepala{padding:22px 20px}.rw-kepala h2{font-size:22px}.rw-kepala .bn-ik{width:46px;height:46px}}
@media (prefers-reduced-motion:reduce){.rw-kepala{animation:none}}
.rw-filter select{background:rgba(255,255,255,.95);border:0;border-radius:11px;color:var(--navy);font-weight:700}
.rw-ringkas>*{box-shadow:0 6px 18px rgba(15,27,45,.08);transition:transform .2s,box-shadow .2s;animation:rw-masuk .45s both}
.rw-ringkas>*:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(15,27,45,.14)}
</style>

<div class="rw-kepala">
  <div>
    <span class="bn-ik"><svg class="i"><use href="#history"/></svg></span>
    <div><h2>Riwayat Perjalanan</h2>
    <p id="rw-sub">Perjalanan yang sudah Anda selesaikan.</p>
    </div>
  </div>
  <div class="rw-filter">
    <select id="rw-bulan" aria-label="Bulan"></select>
    <select id="rw-tahun" aria-label="Tahun"></select>
    <button type="button" class="rw-segar" id="rw-segarkan"><svg class="i"><use href="#history"/></svg>Segarkan</button>
  </div>
</div>

<div class="rw-ringkas" id="rw-ringkas"></div>
<div id="rw-isi"></div>
