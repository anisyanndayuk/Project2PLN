<script>
(function () {
  const R = $('#h-mobildriver'), q = s => $(s, R);
  let data = null, tab = 'mobil', cari = '', saring = '', form = null;

  const FILTER_MOBIL = [['', 'Semua Status'], ['tersedia', 'Tersedia'], ['pakai', 'Sedang Dipakai'], ['lain', 'Tidak Siap']];
  const FILTER_DRIVER = [['', 'Semua Status'], ['standby', 'Siap Tugas'], ['bertugas', 'Bertugas'], ['nonaktif', 'Nonaktif'], ['sim', 'SIM Perlu Dicek']];
  const KOLOM_MOBIL = ['Unit', 'Plat', 'Kapasitas', 'Driver Tetap', 'KM Terakhir', 'Status', 'Aksi'];
  const KOLOM_DRIVER = ['Driver', 'SIM', 'Pengalaman', 'Rute Dikuasai', 'Sertifikasi', 'Status Sekarang'];
  const STATUS_MOBIL = ['Tersedia', 'Perawatan', 'Tidak Aktif'];
  const JENIS_SIM = ['A', 'B1', 'B1 Umum', 'B2', 'B2 Umum', 'C'];

  const km = v => {
    const n = Number(String(v == null ? '' : v).replace(/[^0-9.]/g, ''));
    return (v === '' || v == null || isNaN(n)) ? '-' : n.toLocaleString('id-ID') + ' KM';
  };
  const pill = (warna, teks) => '<span class="md-pill ' + warna + '">' + esc(teks) + '</span>';
  const strip = v => (v === '' || v == null) ? '<span class="md-abu">-</span>' : esc(v);

  async function kirim(fn) {
    const r = await panggil.apply(null, arguments);
    if (r && r.ok === false) { const e = new Error(r.pesan || 'Terjadi kesalahan.'); e.kode = r.kode; throw e; }
    return r;
  }

  // ---------------- Muat & tampilkan ----------------
  function render(d) {
    if (!d.ok) return galat(d.pesan, d.kode);
    data = d;
    R.classList.remove('memuat');
    q('#md-galat').hidden = true;
    const s = d.stats, perhatian = s.tidakSiap + s.simBermasalah;
    q('#md-s-armada').textContent = angka(s.totalMobil);
    q('#md-t-armada').textContent = angka(s.siap) + ' Siap Digunakan';
    q('#md-s-driver').textContent = angka(s.totalDriver);
    q('#md-t-driver').textContent = angka(s.standby) + ' Siap Tugas';
    q('#md-s-perhatian').textContent = angka(perhatian);
    q('#md-t-perhatian').textContent = perhatian ? s.tidakSiap + ' Unit Tidak Siap, ' + s.simBermasalah + ' SIM Perlu Dicek' : 'Semua dalam kondisi baik';
    q('#md-t-perhatian').className = 'md-tag ' + (perhatian ? 'merah' : 'hijau');
    aturFilter();
    renderTabel();
  }

  function galat(pesan, kode) {
    R.classList.remove('memuat');
    const sesi = kode === 'SESI';
    q('#md-masuk').hidden = !sesi; q('#md-ulang').hidden = sesi;
    if (sesi) q('#md-masuk').href = BASE_URL + '?page=login';
    q('#md-galat-teks').textContent = pesan || 'Tidak dapat terhubung ke server.';
    q('#md-galat').hidden = false;
    if (!data) q('#md-tbody').innerHTML = '<tr class="md-kosong"><td colspan="7">Data belum dapat dimuat. Periksa koneksi, lalu coba lagi.</td></tr>';
  }

  async function muat(paksa) {
    if (paksa) { delete App.cache.mobildriver; delete App.cache.beranda; }   // Beranda ikut disegarkan (jumlah mobil tersedia)
    if (!data) R.classList.add('memuat');
    try { await ambil('mobildriver', 'adminGetMobilDriver', 45000, render); }
    catch (e) { galat(e && e.message); }
  }

  function aturFilter() {
    const daftar = tab === 'mobil' ? FILTER_MOBIL
      : FILTER_DRIVER.concat(data && data.cek ? [['bebas', 'Tersedia pada Waktu Ini'], ['tidak', 'Tidak Tersedia']] : []);
    if (!daftar.some(f => f[0] === saring)) saring = '';
    q('#md-filter').innerHTML = daftar.map(f => '<option value="' + f[0] + '">' + esc(f[1]) + '</option>').join('');
    q('#md-filter').value = saring;
    q('#md-cari').placeholder = tab === 'mobil' ? 'Cari nama unit, plat, atau driver...' : 'Cari nama driver, SIM, atau rute...';
  }

  function barisMobil(x) {
    return '<tr><td><b>' + esc(x.jenis || '-') + '</b><small>' + esc(x.id) + (x.asal ? ' &bull; ' + esc(x.asal) : '') + '</small></td>' +
      '<td><span class="plat">' + esc(x.plat || '-') + '</span></td>' +
      '<td class="tengah">' + (x.kapasitas ? esc(x.kapasitas) + ' Penumpang' : '-') + '</td>' +
      '<td>' + strip(x.driverTetap) + '</td>' +
      '<td>' + esc(km(x.km)) + '</td>' +
      '<td>' + pill(x.warna, x.label) + (x.keterangan ? '<small class="md-ket" title="' + esc(x.keterangan) + '">' + esc(x.keterangan) + '</small>' : '') + '</td>' +
      '<td class="tengah"><button class="btn sekunder kecil" data-aksi="edit" data-id="' + esc(x.id) + '">Edit</button></td></tr>';
  }

  function barisDriver(x, adaCek) {
    return '<tr><td><b>' + esc(x.nama) + '</b><small>' + esc(x.id) + (x.hp ? ' &bull; ' + esc(x.hp) : '') + '</small></td>' +
      '<td>' + (x.jenisSim ? '<b>SIM ' + esc(x.jenisSim) + '</b>' : '<span class="md-abu">-</span>') + '<small>' + pill(x.simWarna, x.simTeks) + '</small></td>' +
      '<td>' + (x.pengalaman ? esc(x.pengalaman) + ' Tahun' : '<span class="md-abu">-</span>') + '</td>' +
      '<td class="md-teks">' + strip(x.rute) + '</td>' +
      '<td class="md-teks">' + strip(x.sertifikasi) + '</td>' +
      '<td>' + pill(x.warna, x.label) + (x.tugas ? '<small class="md-teks">' + esc(x.tugas) + '</small>' : '') + '</td>' +
      (adaCek ? '<td>' + pill(x.cek.warna, x.cek.label) + (x.cek.detail ? '<small class="md-teks">' + esc(x.cek.detail) + '</small>' : '') + '</td>' : '') +
      '<td class="tengah"><button class="btn sekunder kecil" data-aksi="edit" data-id="' + esc(x.id) + '">Edit</button></td></tr>';
  }

  function renderTabel() {
    if (!data) return;
    const mobil = tab === 'mobil', semua = mobil ? data.mobil : data.driver, cek = data.cek;
    q('#md-tab-mobil').textContent = 'Mobil (' + data.mobil.length + ')';
    q('#md-tab-driver').textContent = 'Driver (' + data.driver.length + ')';
    R.querySelectorAll('.md-tab').forEach(t => t.classList.toggle('aktif', t.dataset.t === tab));
    q('#md-tambah').innerHTML = ikon('plus') + 'Tambah ' + (mobil ? 'Mobil' : 'Driver');

    // kotak cek ketersediaan hanya untuk tab driver
    q('#md-cek').hidden = mobil;
    q('#md-c-reset').hidden = !cek;
    q('#md-cek-info').hidden = mobil || !cek;
    if (cek) q('#md-cek-info').textContent = 'Pada ' + cek.label + ': ' + cek.bebas + ' dari ' + data.driver.length + ' driver tersedia.';

    const kolom = mobil ? KOLOM_MOBIL : (cek ? KOLOM_DRIVER.concat(['Ketersediaan', 'Aksi']) : KOLOM_DRIVER.concat(['Aksi']));
    q('#md-thead').innerHTML = '<tr>' + kolom.map(k => '<th' + (k === 'Aksi' || k === 'Kapasitas' ? ' class="tengah"' : '') + '>' + k + '</th>').join('') + '</tr>';

    const kata = cari.trim().toLowerCase();
    const list = semua.filter(x => {
      const cocokStatus = !saring
        || (saring === 'sim' ? (x.sim === 'habis' || x.sim === 'segera')
          : saring === 'bebas' ? (x.cek && x.cek.kode === 'bebas')
          : saring === 'tidak' ? (x.cek && x.cek.kode !== 'bebas')
          : x.kode === saring);
      const teks = (mobil ? [x.jenis, x.plat, x.asal, x.driverTetap, x.id] : [x.nama, x.hp, x.jenisSim, x.rute, x.sertifikasi, x.id]).join(' ').toLowerCase();
      return cocokStatus && (!kata || teks.indexOf(kata) !== -1);
    });
    if (!mobil && cek) list.sort((a, c) => (a.cek.kode === 'bebas' ? 0 : 1) - (c.cek.kode === 'bebas' ? 0 : 1));   // yang tersedia di atas

    q('#md-tbody').innerHTML = list.length ? list.map(x => mobil ? barisMobil(x) : barisDriver(x, !!cek)).join('')
      : '<tr class="md-kosong"><td colspan="' + kolom.length + '">' +
        (semua.length ? 'Tidak ada hasil yang cocok.' : 'Belum ada data. Klik Tambah ' + (mobil ? 'Mobil' : 'Driver') + ' untuk memulai.') + '</td></tr>';
    q('#md-info').textContent = 'Menampilkan ' + list.length + ' dari ' + semua.length + (mobil ? ' unit' : ' driver');
  }

  // ---------------- Cek ketersediaan driver ----------------
  async function cekDriver() {
    const tgl = q('#md-c-tgl').value, dari = q('#md-c-dari').value, sampai = q('#md-c-sampai').value;
    if (!tgl || !dari) { toast('Isi tanggal dan jam mulai dulu.'); return; }
    const tombol = q('#md-c-cek');
    tombol.disabled = true; tombol.textContent = 'Mengecek...';
    try { render(await kirim('adminGetMobilDriver', tgl, dari, sampai)); }
    catch (e) {
      if (e.kode === 'SESI') galat(e.message, e.kode); else toast(e.message);
    } finally { tombol.disabled = false; tombol.textContent = 'Cek Ketersediaan'; }
  }

  // ---------------- Pop-up tambah / edit ----------------
  const opt = (arr, cur) => arr.map(a => '<option value="' + esc(a[0]) + '"' + (String(a[0]) === String(cur) ? ' selected' : '') + '>' + esc(a[1]) + '</option>').join('');
  const sel = (id, arr, cur) => '<div class="md-pilih"><select id="md-f-' + id + '">' + opt(arr, cur) + '</select>' + ikon('chevron') + '</div>';
  const inp = (id, tipe, nilai, ekstra) => '<input id="md-f-' + id + '" type="' + tipe + '" value="' + esc(nilai) + '" ' + (ekstra || '') + '>';
  const fld = (id, label, isi, penuh) => '<div class="md-f' + (penuh ? ' penuh' : '') + '"><label class="md-lbl" for="md-f-' + id + '">' + label + '</label>' + isi + '</div>';
  const v = id => { const e = q('#md-f-' + id); return e ? e.value : ''; };

  function bodyMobil(x) {
    const status = STATUS_MOBIL.slice();
    const cur = status.filter(s => s.toLowerCase() === String(x.status || '').toLowerCase())[0] || x.status || 'Tersedia';
    if (status.indexOf(cur) === -1) status.push(cur);
    const tetap = [['', 'Tanpa driver tetap']].concat(data.driver.filter(r => r.aktif || r.id === x.idDriverTetap).map(r => [r.id, r.nama]));
    return '<div class="md-grid">' +
      fld('jenis', 'Jenis / Nama Unit', inp('jenis', 'text', x.jenis, 'maxlength="60" placeholder="Contoh: Toyota Innova Reborn 2.4 G"'), true) +
      fld('plat', 'Plat Nomor', inp('plat', 'text', x.plat, 'maxlength="15" placeholder="N 1420 AP" style="text-transform:uppercase"')) +
      fld('kapasitas', 'Kapasitas (Penumpang)', inp('kapasitas', 'number', x.kapasitas || '', 'min="1" max="60"')) +
      fld('asal', 'Asal / Pool', inp('asal', 'text', x.asal, 'maxlength="60" placeholder="Pool UP3 Malang"')) +
      fld('km', 'KM Terakhir', inp('km', 'text', String(x.km || '').replace(/[^0-9]/g, ''), 'inputmode="numeric" placeholder="Contoh: 68302"')) +
      fld('tetap', 'Driver Tetap', sel('tetap', tetap, x.idDriverTetap || '')) +
      fld('status', 'Status Unit', sel('status', status.map(s => [s, s]), cur)) +
      fld('ket', 'Keterangan', '<textarea id="md-f-ket" maxlength="200" placeholder="Opsional, mis. alasan perawatan">' + esc(x.keterangan) + '</textarea>', true) + '</div>';
  }

  function bodyDriver(x, baru) {
    const sims = JENIS_SIM.slice();
    if (x.jenisSim && sims.indexOf(x.jenisSim) === -1) sims.push(x.jenisSim);
    const calon = data.calonDriver || [];
    const pengguna = !baru ? fld('x', 'Pengguna', '<div class="md-baca">' + esc(x.nama) + ' (' + esc(x.id) + ')</div>', true)
      : (calon.length ? fld('pengguna', 'Pengguna', sel('pengguna', calon.map(c => [c.id, c.nama + (c.hp ? ' - ' + c.hp : '')]), ''), true)
        : '<div class="md-f penuh"><div class="info" style="margin-top:12px">Belum ada pengguna berperan Driver yang belum terdaftar. Tambahkan dulu akunnya di menu Pengguna.</div></div>');
    return '<div class="md-grid">' + pengguna +
      fld('sim', 'Jenis SIM', sel('sim', [['', 'Pilih jenis SIM']].concat(sims.map(s => [s, 'SIM ' + s])), x.jenisSim || '')) +
      fld('exp', 'Masa Berlaku SIM', inp('exp', 'date', x.masaSim || '')) +
      fld('peng', 'Pengalaman (Tahun)', inp('peng', 'number', x.pengalaman || '', 'min="0" max="60"')) +
      fld('aktif', 'Status Akun', sel('aktif', [['1', 'Aktif'], ['0', 'Nonaktif']], x.aktif === false ? '0' : '1')) +
      fld('rute', 'Rute Dikuasai', inp('rute', 'text', x.rute, 'maxlength="200" placeholder="Contoh: Malang, Surabaya, Probolinggo"'), true) +
      fld('sert', 'Sertifikasi', inp('sert', 'text', x.sertifikasi, 'maxlength="200" placeholder="Contoh: Defensive Driving"'), true) + '</div>';
  }

  function bukaForm(jenis, id) {
    if (!data) return;
    const baru = !id, mobil = jenis === 'mobil';
    const x = baru ? {} : (mobil ? data.mobil : data.driver).filter(i => i.id === id)[0];
    if (!x) return;
    const tanpaCalon = !mobil && baru && !(data.calonDriver || []).length;
    form = mobil
      ? { fn: 'adminSimpanMobil', ambil: () => ({ id: id || '', jenis: v('jenis'), plat: v('plat'), kapasitas: v('kapasitas'), asal: v('asal'), km: v('km'),
                                                 idDriverTetap: v('tetap'), status: v('status'), keterangan: v('ket') }) }
      : { fn: 'adminSimpanDriver', ambil: () => ({ id: id || '', idPengguna: baru ? v('pengguna') : x.idPengguna, jenisSim: v('sim'), masaSim: v('exp'),
                                                  pengalaman: v('peng'), aktif: v('aktif') === '1', rute: v('rute'), sertifikasi: v('sert') }) };
    q('#md-kotak').innerHTML =
      '<div class="md-mh"><h3>' + (baru ? 'Tambah ' : 'Edit ') + (mobil ? 'Mobil' : 'Driver') + '</h3>' +
        '<button class="md-x" data-aksi="tutup" aria-label="Tutup">' + ikon('close') + '</button></div>' +
      '<div class="md-mb">' + (mobil ? bodyMobil(x) : bodyDriver(x, baru)) + '</div>' +
      '<div class="md-mf"><span class="md-err" id="md-err"></span>' +
        '<button class="btn sekunder kecil" data-aksi="tutup">Batal</button>' +
        '<button class="btn utama kecil" id="md-simpan" data-aksi="simpan"' + (tanpaCalon ? ' disabled' : '') + '>Simpan</button></div>';
    q('#md-overlay').classList.add('show');
    const pertama = q('#md-kotak input, #md-kotak select'); if (pertama) pertama.focus();
  }

  function tutup() { q('#md-overlay').classList.remove('show'); form = null; }

  async function simpan() {
    if (!form) return;
    const tombol = q('#md-simpan');
    tombol.disabled = true; tombol.textContent = 'Menyimpan...'; q('#md-err').textContent = '';
    try {
      const r = await kirim(form.fn, form.ambil());
      toast(r.pesan); tutup(); muat(true);
    } catch (e) {
      if (e.kode === 'SESI') { tutup(); galat(e.message, e.kode); return; }
      q('#md-err').textContent = e.message;
      tombol.disabled = false; tombol.textContent = 'Simpan';
    }
  }

  // ---------------- Pemasangan ----------------
  const AKSI = {
    ulang: () => muat(true),
    tab: a => { tab = a.dataset.t; cari = ''; saring = ''; q('#md-cari').value = ''; aturFilter(); renderTabel(); },
    tambah: () => bukaForm(tab, ''),
    edit: a => bukaForm(tab, a.dataset.id),
    cek: cekDriver,
    reset: () => muat(true),
    tutup: tutup, simpan: simpan
  };

  function init() {
    const sekarang = new Date();
    q('#md-c-tgl').value = sekarang.toLocaleDateString('sv-SE', { timeZone: TZ });
    q('#md-c-dari').value = sekarang.toLocaleTimeString('en-GB', { timeZone: TZ, hour: '2-digit', minute: '2-digit' });
    aturFilter();
    R.addEventListener('click', e => {
      if (e.target.id === 'md-overlay') { tutup(); return; }
      if (e.target.closest('#md-masuk')) {
        e.preventDefault();
        try { sessionStorage.removeItem('sid'); } catch (x) {}
        google.script.run.withSuccessHandler(h => { document.open(); document.write(h); document.close(); }).bukaLogin();
        return;
      }
      const a = e.target.closest('[data-aksi]');
      if (a && AKSI[a.dataset.aksi]) AKSI[a.dataset.aksi](a);
    });
    R.addEventListener('input', e => { if (e.target.id === 'md-cari') { cari = e.target.value; renderTabel(); } });
    R.addEventListener('change', e => { if (e.target.id === 'md-filter') { saring = e.target.value; renderTabel(); } });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && App.sekarang === 'mobildriver') tutup(); });
  }

  App.daftar('mobildriver', { init: init, tampil: () => muat(), tinggal: tutup });
})();
</script>
