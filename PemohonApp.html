<head>

  <style>
  :root{--y:#F7E52A;--yd:#E9D519;--navy:#0F2C59;--b:#1D6FA5;--bl:#E0F2FE;--ink:#111827;--mut:#6B7280;--line:#E5E7EB;--bg:#F6F8FC;--red:#DC2626;--hdr:68px;--sb:250px}
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',sans-serif}
  body{background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
  button{cursor:pointer;font-family:inherit}
  :focus-visible{outline:3px solid var(--b);outline-offset:2px}

  /* ===== Sidebar ===== */
  .sb{position:fixed;top:0;left:0;bottom:0;width:var(--sb);background:#fff;border-right:1px solid var(--line);padding:20px 14px;z-index:120;display:flex;flex-direction:column}
  .brand{display:flex;align-items:center;gap:10px;padding:2px 8px 26px}
  .brand svg{width:40px;height:40px;flex-shrink:0}
  .brand b{display:block;font-size:17px;font-weight:800;color:var(--navy);letter-spacing:-.3px;line-height:1.1}
  .brand small{display:block;font-size:11.5px;font-weight:500;color:var(--b);margin-top:2px}
  .nav{display:flex;flex-direction:column;gap:6px}
  .nav-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:10px;color:#4B5563;font-size:14px;font-weight:500;text-decoration:none;transition:background .15s}
  .nav-item i{width:18px;text-align:center;font-size:15px}
  .nav-item:hover{background:#F9FAFB}
  .nav-item.active{background:var(--y);color:var(--ink);font-weight:700;box-shadow:0 3px 10px rgba(233,213,25,.45)}
  .bdg{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:none;align-items:center;justify-content:center}
  .bdg.on{display:inline-flex}
  .sp{flex:1}
  .logout{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:10px;color:#4B5563;font-size:14px;font-weight:500;text-decoration:none}
  .logout:hover{background:#FEF2F2;color:var(--red)}
  .ov{display:none;position:fixed;inset:0;background:rgba(17,24,39,.45);z-index:115}
  .ov.on{display:block}

  /* ===== Header ===== */
  .hd{position:fixed;top:0;left:var(--sb);right:0;height:var(--hdr);background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 28px;z-index:110}

  .main{margin-left:var(--sb);margin-top:var(--hdr);padding:24px 28px 48px;min-height:calc(100vh - var(--hdr))}

  .mb .c{background:#F3F4F6;color:#374151}.mb .y{background:var(--red);color:#fff}.mb .y:disabled{background:#9CA3AF}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);max-width:90vw;background:#111827;color:#fff;padding:11px 18px;border-radius:10px;font-size:13.5px;z-index:3000;display:none}

  /* ===== Responsif ===== */
  @media(max-width:1100px){.dpill{display:none}}
  @media(max-width:768px){
    .mt{display:block}.me>div:first-child{display:none}.hl p{display:none}

  .loading-text p{font-size:12.5px;color:#64748B;margin:0;text-align:center;animation:pulseText 1.5s ease-in-out infinite}
  </style>
</head>

  <!-- ===== Toast + loadView ===== -->
  <script>
    function toast(pesan) {
      var t = document.getElementById('toast');
      t.textContent = pesan;
      t.style.display = 'block';
      clearTimeout(toast._t);
      toast._t = setTimeout(function () { t.style.display = 'none'; }, 2500);
    }

    var URL_HALAMAN = {
      PemohonBeranda: 'berandaPemohon',
      PemohonBuatBooking: 'buatBookingPemohon',
      PemohonBookingSaya: 'bookingSayaPemohon',
      PemohonRiwayat: 'riwayatPemohon'
    };

    function loadView(namaHalaman) {
      var area = document.getElementById('main-content');

      // ganti tulisan ?page=... di address bar tanpa reload
      try {
        if (google.script.history) {
          google.script.history.push({ view: namaHalaman }, { page: URL_HALAMAN[namaHalaman] });
        }
      } catch (e) {}

      document.querySelectorAll('.nav-item').forEach(function (el) {
        el.classList.toggle('active', el.dataset.view === namaHalaman);
      });

      area.innerHTML =
        '<div class="app-loading-container">' +
          '<div class="loading-card">' +
            '<div class="brand-spinner"><div class="spinner-ring"></div></div>' +
            '<div class="loading-text">' +
              '<h3>Memuat Konten...</h3>' +
              '<p>Mohon tunggu sebentar</p>' +
            '</div>' +
          '</div>' +
        '</div>';

      google.script.run
        .withSuccessHandler(function (html) {
          area.innerHTML = html;
          window.scrollTo(0, 0);
          if (namaHalaman === 'PemohonBeranda' && typeof initBerandaPemohon === 'function') initBerandaPemohon();
        })
        .withFailureHandler(function () {
          area.innerHTML = '<div class="err">Gagal memuat halaman. Periksa koneksi lalu muat ulang.</div>';
        })
        .loadPageContent(namaHalaman, SID);
    }
  </script>

  <!-- ===== JS Sidebar / Header / Profil ===== -->
  <script>
  (function () {
    var $ = function (id) { return document.getElementById(id); };
    var esc = function (s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); };

    function inisial(nama) {
      var k = String(nama || '').trim().split(/\s+/);
      return ((k[0] || '-')[0] + (k[1] ? k[1][0] : '')).toUpperCase();
    }

    // Isi header dan popover dari data sesi
    function isiProfil() {
      $('hdNama').textContent = (USER.nama || '-').split(/\s+/)[0];
      $('hdBagian').textContent = 'Bagian ' + (USER.bagian || '-');
      $('hdAvatar').textContent = inisial(USER.nama).slice(0, 1);
      $('pfAvatar').textContent = inisial(USER.nama).slice(0, 1);
      $('pfJudul').textContent = (USER.nama || '-').split(/\s+/)[0];
      $('pfTag').textContent = String(USER.peran || '').toUpperCase();
      $('pfNip').textContent = USER.nip ? 'NIP: ' + USER.nip : '';
      $('pfUser').value = USER.username || '';
      $('pfNama').value = USER.nama || '';
      $('pfEmail').value = USER.email || '';
      $('pfPeran').value = USER.peran || '';
      $('pfBagian').innerHTML = DAFTAR_BAGIAN.map(function (b) {
        return '<option value="' + esc(b) + '"' + (b === USER.bagian ? ' selected' : '') + '>' + esc(b) + '</option>';
      }).join('');
    }
    isiProfil();
    $('hdTanggal').textContent = new Date().toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'short', year: 'numeric' });

    function pesan(id, teks, tipe) {
      var el = $(id);
      el.className = 'msg' + (teks ? ' ' + tipe : '');
      el.textContent = teks || '';
    }

    // ----- Popover profil & notifikasi -----
    function tutupSemua() {
      ['popProfil', 'popNotif'].forEach(function (id) { $(id).classList.remove('on'); });
      $('btnProfil').setAttribute('aria-expanded', 'false');
      $('btnNotif').setAttribute('aria-expanded', 'false');
    }
    function toggle(popId, btnId) {
      var buka = !$(popId).classList.contains('on');
      tutupSemua();
      $(popId).classList.toggle('on', buka);
      $(btnId).setAttribute('aria-expanded', buka ? 'true' : 'false');
      return buka;
    }
    $('btnProfil').addEventListener('click', function (e) {
      e.stopPropagation();
      if (toggle('popProfil', 'btnProfil')) { pesan('pfMsg', ''); pesan('pwMsg', ''); }
    });
    $('btnNotif').addEventListener('click', function (e) { e.stopPropagation(); toggle('popNotif', 'btnNotif'); });
    $('pfTutup').addEventListener('click', tutupSemua);
    document.addEventListener('click', function (e) { if (!e.target.closest('.pw')) tutupSemua(); });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { tutupSemua(); $('modalLogout').classList.remove('on'); }
    });

    $('btnSimpanProfil').addEventListener('click', function () {
      var btn = this;
      pesan('pfMsg', '');
      btn.disabled = true;
      google.script.run
        .withSuccessHandler(function (r) {
          btn.disabled = false;
          if (r.status === 'success') {
            USER = r.user; isiProfil();
            pesan('pfMsg', r.message, 'ok');
            if (typeof initSapaBeranda === 'function') initSapaBeranda();
          } else pesan('pfMsg', r.message, 'er');
        })
        .withFailureHandler(function () { btn.disabled = false; pesan('pfMsg', 'Koneksi terputus. Coba lagi.', 'er'); })
        .simpanProfil(SID, $('pfNama').value, $('pfEmail').value, $('pfBagian').value);
    });

    $('btnTogglePw').addEventListener('click', function () { $('boxPw').classList.toggle('on'); });
    $('btnSimpanPw').addEventListener('click', function () {
      var btn = this, lama = $('pwLama').value, baru = $('pwBaru').value, konf = $('pwKonf').value;
      pesan('pwMsg', '');
      if (!lama || !baru) return pesan('pwMsg', 'Isi password lama dan password baru.', 'er');
      if (baru.length < 8) return pesan('pwMsg', 'Password baru minimal 8 karakter.', 'er');
      if (baru !== konf) return pesan('pwMsg', 'Konfirmasi password tidak sama.', 'er');
      btn.disabled = true;
      google.script.run
        .withSuccessHandler(function (r) {
          btn.disabled = false;
          pesan('pwMsg', r.message, r.status === 'success' ? 'ok' : 'er');
          if (r.status === 'success') { $('pwLama').value = ''; $('pwBaru').value = ''; $('pwKonf').value = ''; }
        })
        .withFailureHandler(function () { btn.disabled = false; pesan('pwMsg', 'Koneksi terputus. Coba lagi.', 'er'); })
        .ubahPassword(SID, lama, baru);
    });

    // ----- Navigasi + menu mobile -----
    function tutupSidebar() { $('sidebar').classList.remove('on'); $('overlay').classList.remove('on'); }
    $('btnMenu').addEventListener('click', function () { $('sidebar').classList.toggle('on'); $('overlay').classList.toggle('on'); });
    $('overlay').addEventListener('click', tutupSidebar);
    document.querySelectorAll('.nav-item').forEach(function (a) {
      a.addEventListener('click', function (e) { e.preventDefault(); loadView(a.dataset.view); tutupSidebar(); });
    });

    // ----- Logout -----
    $('btnLogout').addEventListener('click', function (e) { e.preventDefault(); $('modalLogout').classList.add('on'); });
    $('logoutBatal').addEventListener('click', function () { $('modalLogout').classList.remove('on'); });
    $('modalLogout').addEventListener('click', function (e) { if (e.target === this) this.classList.remove('on'); });
    $('logoutYa').addEventListener('click', function () {
      this.disabled = true; this.textContent = 'Logout...';
      var tombol = this;
      function keluar() {
        google.script.run
          .withSuccessHandler(function (html) { document.open(); document.write(html); document.close(); })
          .withFailureHandler(function () {
            tombol.disabled = false; tombol.textContent = 'Ya, logout';
            if (typeof toast === 'function') toast('Gagal keluar. Periksa koneksi lalu coba lagi.');
          })
          .bukaLogin();
      }
      google.script.run.withSuccessHandler(keluar).withFailureHandler(keluar).logoutUser(SID);
    });

    // ----- Dipanggil halaman: badge menu & isi notifikasi -----
    window.setBadgeDinilai = function (n) {
      var b = $('badgeDinilai');
      b.textContent = n > 99 ? '99+' : n;
      b.classList.toggle('on', n > 0);
    };
    window.setNotif = function (daftar) {
      $('notifDot').classList.toggle('on', daftar.length > 0);
      $('popNotif').innerHTML = daftar.length
        ? daftar.map(function (t) { return '<div class="ni"><i class="fas fa-circle-info"></i><span>' + esc(t) + '</span></div>'; }).join('')
        : '<div class="ni kosong">Tidak ada notifikasi.</div>';
    };
  })();
  </script>
