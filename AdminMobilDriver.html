<style>
#h-mobildriver{display:grid;gap:18px}
#h-mobildriver .info{margin:0}
#h-mobildriver .btn.kecil{padding:8px 12px;font-size:12.5px;border-radius:8px}
#h-mobildriver .btn svg.i{width:15px;height:15px}
#h-mobildriver .btn.utama:hover:not(:disabled){filter:brightness(.96)}

/* kartu statistik */
.md-stat{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.md-kartu{position:relative;background:#fff;border:1px solid var(--garis);border-radius:14px;padding:16px}
.md-label{font-size:13px;color:#3A4150;margin-bottom:6px;padding-right:56px}
.md-nilai{font-size:32px;font-weight:800;line-height:1.1;margin-bottom:12px}
.md-nilai small{font-size:13px;font-weight:600;color:var(--abu);margin-left:4px}
.md-ikon{position:absolute;top:16px;right:16px;width:44px;height:44px;border-radius:10px;display:grid;place-items:center}
.md-ikon svg.i{width:20px;height:20px}
.md-ic-kuning{background:#FBF0B5;color:#7A5A00}.md-ic-biru{background:#DCEEFB;color:var(--biru)}.md-ic-hijau{background:#DDF5E6;color:#1B8A4B}
.md-tag{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:600}
.md-tag::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.md-tag.merah{background:#FDE2E2;color:#B42318}.md-tag.biru{background:#DCEEFB;color:var(--biru)}.md-tag.hijau{background:#DDF5E6;color:#1B8A4B}
.memuat .md-nilai{color:#CBD5E1}

/* panel tabel */
.md-panel{background:#fff;border:1px solid var(--garis);border-radius:14px;overflow:hidden}
.md-kepala{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:16px}
.md-tabs{display:flex;gap:4px;padding:4px;background:#EEF2FA;border-radius:10px}
.md-tab{padding:6px 16px;border-radius:8px;font-size:12.5px;font-weight:600;color:#3A4150;cursor:pointer;border:0;background:transparent}
.md-tab.aktif{background:#fff;color:var(--teks);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.md-alat{display:flex;gap:10px;flex-wrap:wrap;padding:0 16px 14px}
.md-cari{position:relative;flex:1;min-width:220px}
.md-cari svg.i{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--abu)}
.md-cari input,.md-pilih select,.md-f input,.md-f textarea{width:100%;padding:11px 14px;border:1px solid #D0DAF0;border-radius:10px;background:#fff;font:inherit;color:var(--teks)}
.md-cari input{padding-left:36px;background:var(--panel)}
.md-pilih{position:relative}
.md-pilih select{appearance:none;padding-right:38px}
.md-pilih svg.i{position:absolute;right:14px;top:50%;transform:translateY(-50%);pointer-events:none;width:14px;height:14px}
.md-alat .md-pilih{width:200px}
.md-alat .md-pilih select{background:var(--panel)}
.md-bungkus{overflow-x:auto}
table.md-tbl{width:100%;border-collapse:collapse}
.md-tbl thead th{background:var(--panel);text-align:left;padding:14px 16px;font-size:11.5px;font-weight:700;letter-spacing:.6px;color:#3A4150;text-transform:uppercase;white-space:nowrap}
.md-tbl th.tengah,.md-tbl td.tengah{text-align:center}
.md-tbl tbody td{padding:14px 16px;border-bottom:1px solid var(--garis);font-size:13.5px;vertical-align:middle}
.md-tbl small{display:block;font-size:11.5px;color:var(--abu);margin-top:2px}
.md-tbl td b{font-weight:700}
.md-teks{max-width:220px}
.md-ket{max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.md-abu{color:var(--abu)}
.md-kosong td{text-align:center;color:var(--abu);padding:40px 0!important}
.md-kaki{padding:14px 16px;font-size:12px;color:#3A4150}
.md-pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700;white-space:nowrap}
.md-pill.ok{background:#DCFCE7;color:var(--hijau)}.md-pill.biru{background:#DBEAFE;color:#1D4ED8}
.md-pill.kuning{background:#FEF9C3;color:#7A5A00}.md-pill.merah{background:#FDE2E2;color:#B42318}.md-pill.abu{background:#EEF1F6;color:#475569}

/* pop-up tambah / edit */
.md-overlay{position:fixed;inset:0;z-index:45;display:none;align-items:center;justify-content:center;background:rgba(15,23,42,.38);backdrop-filter:blur(4px);padding:16px}
.md-overlay.show{display:flex}
.md-modal{width:100%;max-width:620px;max-height:90vh;display:flex;flex-direction:column;overflow:hidden;background:#fff;border-radius:16px;box-shadow:0 24px 60px rgba(15,23,42,.28);animation:kotak-masuk .25s ease-out}
.md-mh{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--garis)}
.md-mh h3{flex:1;font-size:17px}
.md-x{background:none;border:0;cursor:pointer;padding:8px;border-radius:8px;display:grid;place-items:center}
.md-x:hover{background:var(--bg)}
.md-mb{padding:6px 18px 18px;overflow-y:auto;background:#F4F7FD;flex:1}
.md-mf{display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:14px 18px;border-top:1px solid var(--garis);background:#fff}
.md-err{margin-right:auto;color:var(--merah);font-size:12.5px}
.md-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.md-f.penuh{grid-column:1/-1}
.md-lbl{display:block;font-size:13px;font-weight:700;margin:12px 0 6px}
.md-f textarea{min-height:76px;resize:vertical}
.md-baca{padding:11px 14px;border:1px solid #D0DAF0;border-radius:10px;background:#EEF1F6;font-weight:600}
.md-cek{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0 16px 14px;padding:12px 14px;background:var(--panel);border:1px solid #D0DAF0;border-radius:12px}
.md-cek input[type=date],.md-cek input[type=time]{padding:9px 12px;border:1px solid #D0DAF0;border-radius:10px;font:inherit;background:#fff;color:var(--teks)}
.md-cek .md-abu{font-size:12.5px;color:#3A4150;flex-basis:100%}

@media (max-width:900px){.md-stat{grid-template-columns:1fr}}
@media (max-width:720px){.md-grid{grid-template-columns:1fr}.md-alat .md-pilih{width:100%}}
</style>

<div id="md-galat" class="info galat" hidden>
  <span id="md-galat-teks"></span>
  <a class="btn sekunder" id="md-masuk" target="_top" hidden>Masuk lagi</a>
  <button class="btn sekunder" id="md-ulang" data-aksi="ulang">Coba lagi</button>
</div>

<section class="md-stat">
  <div class="md-kartu">
    <div class="md-label">Total Armada</div>
    <div class="md-nilai"><span id="md-s-armada">-</span><small>unit</small></div>
    <span class="md-tag biru" id="md-t-armada">-</span>
    <span class="md-ikon md-ic-biru"><svg class="i"><use href="#car"/></svg></span>
  </div>
  <div class="md-kartu">
    <div class="md-label">Total Driver</div>
    <div class="md-nilai"><span id="md-s-driver">-</span><small>orang</small></div>
    <span class="md-tag hijau" id="md-t-driver">-</span>
    <span class="md-ikon md-ic-hijau"><svg class="i"><use href="#user"/></svg></span>
  </div>
  <div class="md-kartu">
    <div class="md-label">Perlu Perhatian</div>
    <div class="md-nilai"><span id="md-s-perhatian">-</span><small>catatan</small></div>
    <span class="md-tag hijau" id="md-t-perhatian">-</span>
    <span class="md-ikon md-ic-kuning"><svg class="i"><use href="#info"/></svg></span>
  </div>
</section>

<section class="md-panel">
  <div class="md-kepala">
    <div class="md-tabs">
      <button class="md-tab aktif" id="md-tab-mobil" data-aksi="tab" data-t="mobil">Mobil (0)</button>
      <button class="md-tab" id="md-tab-driver" data-aksi="tab" data-t="driver">Driver (0)</button>
    </div>
    <button class="btn utama kecil" id="md-tambah" data-aksi="tambah">Tambah Mobil</button>
  </div>
  <div class="md-alat">
    <div class="md-cari"><svg class="i"><use href="#search"/></svg><input type="search" id="md-cari" placeholder="Cari nama unit, plat, atau driver..." autocomplete="off"></div>
    <div class="md-pilih"><select id="md-filter" aria-label="Filter status"></select><svg class="i"><use href="#chevron"/></svg></div>
  </div>
  <div class="md-cek" id="md-cek" hidden>
    <b style="font-size:13px">Cek ketersediaan driver:</b>
    <input type="date" id="md-c-tgl" aria-label="Tanggal">
    <input type="time" id="md-c-dari" aria-label="Jam mulai">
    <span class="md-abu" style="flex-basis:auto">s/d</span>
    <input type="time" id="md-c-sampai" aria-label="Jam selesai">
    <button class="btn utama kecil" id="md-c-cek" data-aksi="cek">Cek Ketersediaan</button>
    <button class="btn sekunder kecil" id="md-c-reset" data-aksi="reset" hidden>Reset</button>
    <span class="md-abu" id="md-cek-info" hidden></span>
  </div>
  <div class="md-bungkus">
    <table class="md-tbl">
      <thead id="md-thead"></thead>
      <tbody id="md-tbody"><tr class="md-kosong"><td colspan="7">Memuat data...</td></tr></tbody>
    </table>
  </div>
  <div class="md-kaki" id="md-info">-</div>
</section>

<div class="md-overlay" id="md-overlay"><div class="md-modal" id="md-kotak"></div></div>
