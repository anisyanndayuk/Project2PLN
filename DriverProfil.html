<!-- ============================================================
     DriverProfil.html : markup + CSS halaman Profil & Pengaturan (desain ulang)
     Banner profil bergradien + statistik ringkas, kartu informasi akun berikon, kartu SIM bergaya kartu dengan penunjuk sisa masa berlaku,
     dan kartu Keamanan dengan meter kekuatan password. Dipasang di DriverApp.html dalam section h-profil.
     Logikanya ada di DriverProfilJS.html. CSS memakai awalan pf- agar tidak bentrok dengan fitur lain.
     ============================================================ -->
<style>
#pf-isi{display:grid;gap:22px;align-content:start;grid-template-columns:minmax(0,1fr)}

/* ---- Banner profil ---- */
.pf-banner{position:relative;overflow:hidden;display:flex;gap:24px;justify-content:space-between;align-items:center;flex-wrap:wrap;color:#fff;border-radius:22px;padding:30px 34px;background:linear-gradient(120deg,var(--navy) 0%,#0B6A8F 68%,#12839F 100%);box-shadow:0 12px 32px rgba(10,61,92,.24);animation:pf-masuk .4s both}
.pf-banner::before{content:"";position:absolute;right:-70px;top:-100px;width:290px;height:290px;border-radius:50%;background:rgba(255,230,0,.17)}
.pf-banner::after{content:"";position:absolute;left:38%;bottom:-130px;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,.07)}
.pf-banner>*{position:relative;z-index:1}
.pf-id{display:flex;gap:20px;align-items:center;min-width:0}
.pf-avatar{flex:none;width:92px;height:92px;border-radius:50%;background:var(--kuning);color:var(--navy);display:grid;place-items:center;font-size:40px;font-weight:800;box-shadow:0 0 0 5px rgba(255,255,255,.25),0 10px 24px rgba(0,0,0,.25)}
.pf-id h1{font-size:28px;font-weight:800;line-height:1.15;letter-spacing:-.01em;word-break:break-word}
.pf-id p{opacity:.85;margin-top:4px}
.pf-pil{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.pf-pil span{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.34);border-radius:99px;padding:4px 14px;font-size:12px;font-weight:700}
.pf-pil span.hidup::before{content:"";width:7px;height:7px;border-radius:50%;background:#4ADE80;box-shadow:0 0 0 3px rgba(74,222,128,.25)}
.pf-pil span.mati::before{content:"";width:7px;height:7px;border-radius:50%;background:#FCA5A5;box-shadow:0 0 0 3px rgba(252,165,165,.25)}
.pf-stat{display:flex;gap:12px;flex-wrap:wrap}
.pf-stat>div{min-width:104px;text-align:center;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(6px);border-radius:16px;padding:12px 16px}
.pf-stat b{display:block;font-size:22px;font-weight:800;letter-spacing:-.01em}
.pf-stat small{display:block;opacity:.8;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-top:2px}

/* ---- Kisi kartu ---- */
.pf-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:22px;align-items:start}
.pf-kolom{display:grid;gap:22px;min-width:0}
.pf-kartu{background:#fff;border:1px solid var(--garis);border-radius:20px;padding:24px 26px;box-shadow:0 4px 18px rgba(15,27,45,.06);transition:box-shadow .2s,transform .2s;animation:pf-masuk .45s both}
.pf-kartu:hover{box-shadow:0 12px 28px rgba(15,27,45,.10)}
.pf-kolom:nth-child(2) .pf-kartu{animation-delay:.08s}
@keyframes pf-masuk{from{opacity:0;transform:translateY(10px)}}
.pf-judul{display:flex;gap:12px;align-items:center;margin-bottom:16px}
.pf-judul h3{font-size:17px;line-height:1.2}
.pf-judul small{display:block;color:var(--abu);font-size:12px;margin-top:2px;font-weight:500}
.pf-ik{flex:none;width:42px;height:42px;border-radius:13px;display:grid;place-items:center}
.pf-ik svg.i{width:20px;height:20px}
.pf-ik.biru{background:#DBEAFE;color:#1D4ED8}
.pf-ik.hijau{background:#DCFCE7;color:#15803D}
.pf-ik.kuning{background:#FEF3C7;color:#B45309}
.pf-ik.ungu{background:#EDE9FE;color:#6D28D9}
.pf-ik.abu{background:#F1F5F9;color:#475569}

/* ---- Informasi akun ---- */
.pf-baris{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--garis)}
.pf-baris:first-of-type{border-top:0}
.pf-baris small{display:block;color:var(--abu);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.pf-baris b{display:block;font-weight:700;word-break:break-word;margin-top:1px}
.pf-ubah{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--garis);background:#fff;color:var(--biru);font:inherit;font-weight:700;font-size:13px;border-radius:10px;padding:7px 13px;cursor:pointer;transition:.15s}
.pf-ubah svg.i{width:15px;height:15px}
.pf-ubah:hover{border-color:var(--biru);background:#F0F7FB}
.pf-catatan{margin-top:12px;display:flex;gap:8px;align-items:flex-start;background:#F8FAFC;border-radius:12px;padding:10px 12px;color:var(--abu);font-size:12px;line-height:1.5}
.pf-catatan svg.i{width:15px;height:15px;margin-top:1px;color:var(--biru)}

/* ---- Kartu SIM ---- */
.pf-sim{position:relative;overflow:hidden;color:#fff;border-radius:18px;padding:22px 24px;background:linear-gradient(135deg,#0A3D5C 0%,#0B6A8F 60%,#14899F 100%);box-shadow:0 10px 26px rgba(10,61,92,.25)}
.pf-sim::before{content:"";position:absolute;right:-50px;top:-70px;width:200px;height:200px;border-radius:50%;background:rgba(255,230,0,.18)}
.pf-sim::after{content:"";position:absolute;left:-40px;bottom:-90px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.07)}
.pf-sim>*{position:relative;z-index:1}
.pf-sim-atas{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pf-sim-atas span{font-size:11px;font-weight:800;letter-spacing:.14em;opacity:.85}
.pf-sim-atas svg.i{width:26px;height:26px;color:var(--kuning)}
.pf-sim small{display:block;opacity:.75;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-top:18px}
.pf-sim .tgl{font-size:24px;font-weight:800;letter-spacing:-.01em;margin-top:2px}
.pf-sim-bawah{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-top:16px}
.pf-sim .nama{font-weight:700;opacity:.92}
.pf-badge{border-radius:99px;padding:5px 13px;font-size:12px;font-weight:800;background:#DCFCE7;color:#14532D;white-space:nowrap}
.pf-badge.kuning{background:#FEF3C7;color:#92400E}
.pf-badge.merah{background:#FEE2E2;color:#991B1B}
.pf-badge.abu{background:#E2E8F0;color:#475569}
.pf-sisa{margin-top:16px}
.pf-sisa-bar{height:8px;border-radius:99px;background:rgba(255,255,255,.2);overflow:hidden}
.pf-sisa-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#4ADE80,#22C55E);width:0;transition:width .8s cubic-bezier(.2,.7,.2,1)}
.pf-sisa-bar i.kuning{background:linear-gradient(90deg,#FDE047,#FACC15)}
.pf-sisa-bar i.merah{background:linear-gradient(90deg,#FCA5A5,#F87171)}
.pf-sisa p{margin-top:7px;font-size:12px;opacity:.8}
.pf-info{margin-top:14px;display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:12px 14px;font-weight:600;line-height:1.45;background:#FEF3C7;color:#92400E}
.pf-info svg.i{width:18px;height:18px;margin-top:1px}
.pf-info.galat{background:#FEE2E2;color:#991B1B}

/* ---- Form password ---- */
.pf-form{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.pf-f label{display:block;font-weight:700;font-size:13px;margin-bottom:6px}
.pf-input{position:relative}
.pf-input>svg.i{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--abu);pointer-events:none}
.pf-input input{width:100%;border:1.5px solid var(--garis);border-radius:12px;padding:13px 46px 13px 42px;font:inherit;background:#F8FAFC;color:var(--teks);transition:border-color .15s,box-shadow .15s,background .15s}
.pf-input input:focus{outline:none;border-color:var(--biru);background:#fff;box-shadow:0 0 0 3px rgba(11,95,138,.15)}
.pf-input input:focus~svg.i,.pf-input:focus-within>svg.i{color:var(--biru)}
.pf-f.salah .pf-input input{border-color:var(--merah);background:#FFF7F7}
.pf-mata{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;border:0;background:none;border-radius:8px;color:var(--abu);cursor:pointer;display:grid;place-items:center}
.pf-mata:hover{background:#F1F5F9;color:var(--biru)}
.pf-mata.on{color:var(--biru)}
.pf-galat{display:none;color:var(--merah);font-size:12px;font-weight:600;margin-top:6px}
.pf-f.salah .pf-galat{display:block}
.pf-umum{display:none;background:#FEE2E2;color:#991B1B;border-radius:12px;padding:11px 14px;font-weight:600}
.pf-umum.tampil{display:block}

/* Meter kekuatan + daftar syarat */
.pf-meter{margin-top:10px}
.pf-meter-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.pf-meter-bar i{height:6px;border-radius:99px;background:#E2E8F0;transition:background .2s}
.pf-meter-bar.s1 i:nth-child(-n+1){background:#EF4444}
.pf-meter-bar.s2 i:nth-child(-n+2){background:#F59E0B}
.pf-meter-bar.s3 i:nth-child(-n+3){background:#84CC16}
.pf-meter-bar.s4 i{background:#22C55E}
.pf-meter-teks{display:flex;justify-content:space-between;gap:8px;margin-top:6px;font-size:12px;color:var(--abu)}
.pf-meter-teks b{color:var(--teks)}
.pf-syarat{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.pf-syarat span{display:inline-flex;gap:5px;align-items:center;background:#F1F5F9;color:#64748B;border-radius:99px;padding:4px 10px;font-size:12px;font-weight:600;transition:.2s}
.pf-syarat span svg.i{width:13px;height:13px;opacity:.35}
.pf-syarat span.ok{background:#DCFCE7;color:#14532D}
.pf-syarat span.ok svg.i{opacity:1}

.pf-form .btn{width:100%;padding:14px 22px;border-radius:12px;display:flex;gap:8px;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(255,214,0,.35);transition:transform .15s,box-shadow .15s}
.pf-form .btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 10px 20px rgba(255,214,0,.45)}
.pf-form .btn:disabled{opacity:.6;cursor:not-allowed;box-shadow:none}

/* Modal ubah No. HP memakai kelas yang sama */
.pf-petunjuk{color:var(--abu);font-size:12px;margin-top:6px;line-height:1.45}

.pf-kosong{background:#fff;border:1px dashed #CBD5E1;border-radius:18px;padding:44px 20px;text-align:center;color:var(--abu)}
.pf-kosong b{display:block;color:var(--teks);font-size:16px;margin-bottom:4px}

@media (max-width:900px){
  .pf-grid{grid-template-columns:1fr}
}
@media (max-width:560px){
  .pf-banner{padding:24px 20px}
  .pf-id{flex-direction:column;align-items:flex-start;gap:14px}
  .pf-avatar{width:76px;height:76px;font-size:32px}
  .pf-id h1{font-size:24px}
  .pf-stat{width:100%}
  .pf-stat>div{flex:1;min-width:0;padding:10px 8px}
  .pf-kartu{padding:20px 18px}
  .pf-sim{padding:20px}
}
@media (prefers-reduced-motion:reduce){.pf-banner,.pf-kartu{animation:none}}
</style>

<div id="pf-isi"></div>
