<!DOCTYPE html>
<html lang="id">
<head>
<base target="_top">
<meta charset="utf-8">
<title>BookTrip PLN</title>

<!-- ============================================================
     [1] CSS GLOBAL
     Dipakai semua fitur driver. CSS khusus satu fitur ditaruh
     di file fiturnya (contoh: DriverBeranda.html), bukan di sini.
     ============================================================ -->
<style>
/* ---- 1.1 Variabel warna & reset ---- */
:root{--kuning:#FFE600;--biru:#0B5F8A;--navy:#0A3D5C;--teks:#0F1B2D;--abu:#64748B;--garis:#E5E9F0;--bg:#F3F5F9;--panel:#EEF3FD;--merah:#DC2626;--hijau:#15803D}
*{box-sizing:border-box;margin:0}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--teks);font-size:14px;line-height:1.45}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:3px solid var(--biru);outline-offset:2px}

/* ---- 1.2 Kerangka & SIDEBAR ---- */
.app{display:flex;min-height:100vh}
.sisi{width:232px;background:#fff;border-right:1px solid var(--garis);padding:18px 14px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;flex:none;overflow-y:auto}
.logo{display:flex;gap:10px;align-items:center;margin-bottom:22px}
.logo-img{width:40px;height:40px;flex:none;display:block}
.logo b{display:block;font-size:15px}.logo small{color:var(--biru);font-size:11px}
.menu{display:flex;flex-direction:column;gap:4px;flex:1}
.menu small{color:var(--abu);font-size:10px;margin:0 10px 6px}
.menu a{display:flex;gap:10px;align-items:center;padding:11px 12px;border-radius:10px;font-weight:600;cursor:pointer;user-select:none}
.menu a:hover{background:var(--bg)}
.menu a.aktif{background:var(--kuning);font-weight:800}
.keluar{flex:none;margin-top:12px;display:flex;gap:8px;align-items:center;justify-content:center;padding:12px;border:0;border-radius:10px;background:#FEE2E2;color:var(--merah);font-weight:700;cursor:pointer}

/* ---- 1.3 NAVBAR (header atas) & area konten ---- */
.utama{flex:1;min-width:0}
.atas{display:flex;gap:16px;align-items:center;justify-content:space-between;padding:14px 28px;background:#fff;border-bottom:1px solid var(--garis);position:sticky;top:0;z-index:30}
.judul b{font-size:16px;display:flex;gap:8px;align-items:center}
.judul small{color:var(--abu);font-size:12px}
.kanan{display:flex;gap:12px;align-items:center}
.chip-tgl{display:flex;gap:6px;align-items:center;background:var(--panel);color:var(--biru);padding:6px 12px;border-radius:99px;font-size:12px;font-weight:600}
.lonceng{position:relative;width:36px;height:36px;border:0;border-radius:10px;background:var(--bg);color:inherit;cursor:pointer;display:grid;place-items:center;transition:background .15s}
.lonceng:hover{background:#E3E9F3}
.akun{display:flex;gap:10px;align-items:center;text-align:right}
.akun small{display:block;color:var(--abu);font-size:11px}
.akun i{width:34px;height:34px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-style:normal;font-weight:700}
main{padding:24px 28px;position:relative;min-height:calc(100vh - 72px)}
.hamburger{display:none;border:0;background:var(--bg);width:38px;height:38px;border-radius:10px;cursor:pointer;place-items:center}

/* ---- 1.4 Komponen umum (pill, plat, kartu, tombol, kondisi kosong, info) ---- */
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700;background:#DBEAFE;color:#1D4ED8;white-space:nowrap}
.pill.jalan{background:#DCFCE7;color:var(--hijau)}
.pill.kantor{background:var(--panel);color:var(--biru)}
.plat{background:#1E293B;color:#fff;border-radius:6px;padding:3px 8px;font-size:11px;font-weight:700;white-space:nowrap}
.kartu{background:#fff;border:1px solid var(--garis);border-radius:16px;padding:18px}
.btn{border:0;border-radius:10px;padding:13px 18px;font-weight:700;cursor:pointer;display:inline-flex;gap:8px;align-items:center;justify-content:center}
.btn.utama{background:var(--kuning);color:var(--teks)}
.btn.sekunder{background:var(--panel);color:var(--biru)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.kosong{display:grid;justify-items:center;gap:6px;text-align:center;color:var(--abu);padding:36px 12px}
.kosong svg.i{width:36px;height:36px;stroke-width:1.5}
.kosong b{color:var(--teks);font-size:15px}
.kosong.kecil{padding:20px 8px}
.info{display:flex;gap:12px;align-items:center;justify-content:space-between;background:#FEF9C3;border:1px solid #FDE68A;border-radius:12px;padding:12px 16px;margin-bottom:16px}
.info.galat{background:#FEE2E2;border-color:#FECACA}

/* Modal konfirmasi (dipakai fungsi konfirmasi()) */
.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px;background:rgba(15,27,45,.45);animation:mdl-masuk .2s ease-out}
.modal .kotak{width:100%;max-width:380px;background:#fff;border-radius:16px;padding:24px;box-shadow:0 20px 50px rgba(15,27,45,.25);animation:kotak-masuk .25s cubic-bezier(.2,.9,.3,1.1)}
.modal.tutup{animation:mdl-keluar .16s ease-in forwards}
.modal.tutup .kotak{animation:kotak-keluar .16s ease-in forwards}
@keyframes mdl-masuk{from{opacity:0}to{opacity:1}}
@keyframes mdl-keluar{from{opacity:1}to{opacity:0}}
@keyframes kotak-masuk{from{opacity:0;transform:translateY(16px) scale(.95)}to{opacity:1;transform:none}}
@keyframes kotak-keluar{from{opacity:1;transform:none}to{opacity:0;transform:translateY(8px) scale(.97)}}
.modal h3{font-size:17px;margin-bottom:6px}
.modal p{color:var(--abu);margin-bottom:20px}
.modal .aksi-m{display:flex;gap:10px;justify-content:flex-end}
.btn.bahaya{background:var(--merah);color:#fff}

/* ---- 1.5 Toast (pesan singkat di bawah layar) ---- */
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:#0F1B2D;color:#fff;padding:10px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:.25s;z-index:50}
#toast.tampil{opacity:1;transform:translate(-50%,0)}

/* ---- 1.55 Spinner perpindahan halaman & pemuatan data (tema PLN: biru + kuning, terang) ---- */
#muat{position:absolute;inset:0;z-index:20;display:flex;align-items:flex-start;justify-content:center;padding-top:16vh;background:var(--bg);opacity:0;visibility:hidden;transition:opacity .18s,visibility .18s}
#muat.tampil{opacity:1;visibility:visible;transition:none}   /* muncul seketika, hilang memudar */
#muat .m-kartu{display:flex;flex-direction:column;align-items:center;gap:14px;padding:26px 36px;background:#fff;border:1px solid var(--garis);border-radius:18px;box-shadow:0 10px 30px rgba(11,95,138,.10)}
#muat .m-roda{position:relative;width:64px;height:64px}
#muat .m-roda:before{content:"";position:absolute;inset:0;border-radius:50%;border:5px solid var(--panel)}
#muat .m-roda:after{content:"";position:absolute;inset:0;border-radius:50%;border:5px solid transparent;border-top-color:var(--biru);border-right-color:var(--biru);animation:muat-putar .9s cubic-bezier(.5,.15,.5,.85) infinite}
#muat .m-roda i{position:absolute;inset:11px;display:grid;place-items:center;border-radius:50%;background:var(--kuning);animation:muat-denyut 1.2s ease-in-out infinite}
#muat .m-roda svg{width:20px;height:20px;fill:var(--navy)}
#muat b{font-size:13px;font-weight:600;color:var(--biru);letter-spacing:.2px}
@keyframes muat-putar{to{transform:rotate(360deg)}}
@keyframes muat-denyut{50%{transform:scale(.88)}}
@media (prefers-reduced-motion:reduce){#muat .m-roda:after{animation-duration:2s}#muat .m-roda i{animation:none}}

/* ---- 1.6 Responsif (layar kecil: sidebar jadi menu hamburger) ---- */
@media (max-width:900px){
  .sisi{position:fixed;z-index:40;left:0;top:0;transform:translateX(-100%);transition:transform .25s}
  .sisi.buka{transform:none;box-shadow:0 0 40px rgba(15,27,45,.25)}
  .tirai{position:fixed;inset:0;z-index:39;background:rgba(15,27,45,.45);opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s}
  .tirai.buka{opacity:1;visibility:visible}
  body.menu-buka{overflow:hidden}
  .hamburger{display:grid}
  .judul small,.akun div{display:none}
  .atas{padding:12px 16px;gap:10px}main{padding:16px}
  .judul{flex:1;min-width:0}
  .judul b{font-size:15px;white-space:nowrap}
  .kanan{gap:8px;flex:none}
  .hamburger{width:40px;height:40px;flex:none}
  .lonceng{width:40px;height:40px}
  .akun i{width:38px;height:38px}
}
/* HP: chip tanggal disembunyikan agar header muat satu baris; lencana kantor ikut disembunyikan di layar sangat sempit */
@media (max-width:640px){
  .chip-tgl{display:none}
}
@media (max-width:400px){
  .judul .kantor{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<!-- ============================================================
     [5] JAVASCRIPT INTI
     Dipakai semua fitur: sesi, helper, pemanggil server, router.
     JS khusus satu fitur ada di file DriverNAMAJS.html.

<!-- [5a] Data sesi dari server (sid dan baseUrl dikirim oleh Kode.gs) -->
<script>var SID = <?!= JSON.stringify(sid) ?>, BASE_URL = <?!= JSON.stringify(baseUrl) ?>;</script>
<script>
// ---- [5b] Konstanta, penampung data, dan fungsi bantu ----
// PENTING: di level atas pakai var, JANGAN const/let. Halaman ini ditulis ke dokumen yang sama
// dengan document.write (dari Auth.html), dan const/let yang namanya sudah ada (mis. $) akan
// menggagalkan seluruh script dengan "Identifier ... has already been declared".
var TZ = 'Asia/Jakarta';
// true = alamat di browser diganti jadi ?page=dashboardDriver setelah dashboard tampil.
// Syaratnya doGet di Kode.gs sudah diubah (lihat catatan). Kalau belum, set false.
var UBAH_URL = true;
var App = { cache: {}, halaman: {}, sekarang: null };
App.daftar = (nama, hal) => { App.halaman[nama] = hal; }; // tiap fitur mendaftar: { init, tampil, tinggal }
var $ = (s, r) => (r || document).querySelector(s);
var esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
var angka = n => Number(n || 0).toLocaleString('id-ID', { maximumFractionDigits: 1 });
var ikon = n => '<svg class="i"><use href="#' + n + '"/></svg>';
var fmtTgl = (iso, opsi) => new Date(iso + 'T12:00:00+07:00').toLocaleDateString('id-ID', Object.assign({ timeZone: TZ }, opsi));
var tglPanjang = iso => fmtTgl(iso, { weekday: 'long', day: 'numeric', month: 'short', year: 'numeric' });
var tglPendek = iso => fmtTgl(iso, { weekday: 'short', day: 'numeric', month: 'short' });

function toast(teks) {
  const t = $('#toast');
  t.textContent = teks; t.classList.add('tampil');
  clearTimeout(toast.w); toast.w = setTimeout(() => t.classList.remove('tampil'), 2400);
}

// Pop-up konfirmasi, hasilnya Promise true (ya) atau false (batal, Esc, klik di luar kotak).
// Contoh: if (!(await konfirmasi('Mulai perjalanan?', 'Pastikan angka odometer benar.', 'Mulai'))) return;
function konfirmasi(judul, teks, labelYa) {
  return new Promise(selesai => {
    const m = $('#modal'), ya = $('#modal-ya'), batal = $('#modal-batal');
    $('#modal-judul').textContent = judul;
    $('#modal-teks').textContent = teks;
    ya.textContent = labelYa || 'Ya';
    const tombol = e => { if (e.key === 'Escape') tutup(false); };
    function tutup(hasil) {
      ya.onclick = batal.onclick = m.onclick = null;
      document.removeEventListener('keydown', tombol);
      m.classList.add('tutup');                       // animasi keluar, lalu disembunyikan
      setTimeout(() => {
        if (m.classList.contains('tutup')) { m.hidden = true; m.classList.remove('tutup'); }
      }, 160);
      selesai(hasil);
    }
    ya.onclick = () => tutup(true);
    batal.onclick = () => tutup(false);
    m.onclick = e => { if (e.target === m) tutup(false); };
    document.addEventListener('keydown', tombol);
    m.classList.remove('tutup'); m.hidden = false; batal.focus();
  });
}

// ---- [5c] Pemanggil fungsi server (Apps Script) ----
// Panggil fungsi Apps Script sebagai Promise
// SID (sesi login) selalu dikirim sebagai argumen pertama; server menentukan identitas dari sesi itu
function panggil(fn) {
  const arg = [SID].concat(Array.prototype.slice.call(arguments, 1));
  return new Promise((ok, gagal) => {
    const r = google.script.run.withSuccessHandler(ok).withFailureHandler(gagal);
    r[fn].apply(r, arg);
  });
}

// Tampilkan data cache dulu (instan), lalu segarkan di belakang layar bila sudah lewat ttl
// Spinner pemuatan: tampil selama data belum ada, hilang SETELAH data selesai digambar.
// Bila data sudah ada di cache, halaman langsung tampil tanpa spinner (data diperbarui di belakang layar).
var Muat = {
  id: 0, sejak: 0, MIN: 500,                                    // MIN = lama spinner minimal (ms) supaya terlihat halus
  tampil() {
    Muat.id++; Muat.sejak = Date.now();
    $('#muat').classList.add('tampil');
    return Muat.id;
  },
  // Sembunyikan setelah lama minimal terpenuhi. Hanya berlaku bila belum ada spinner yang lebih baru (id sama).
  sembunyi(id) {
    if (id !== Muat.id) return;
    const sisa = Math.max(0, Muat.MIN - (Date.now() - Muat.sejak));
    setTimeout(() => { if (id === Muat.id) $('#muat').classList.remove('tampil'); }, sisa);
  }
};
// args (opsional): argumen tambahan untuk fungsi server, mis. filter bulan dan tahun
async function ambil(kunci, fn, ttl, saatData, args) {
  const c = App.cache[kunci];
  if (c) saatData(c.data);
  if (!c || Date.now() - c.t > ttl) {
    const id = c ? null : Muat.tampil();   // tanpa cache: spinner (ambil alih dari spinner perpindahan)
    try {
      const data = await panggil.apply(null, [fn].concat(args || []));
      if (data && data.ok !== false) App.cache[kunci] = { data: data, t: Date.now() };
      saatData(data);
    } finally { if (id !== null) Muat.sembunyi(id); }
  }
}

// ---- [5d] Shell: pengisi data akun di navbar ----
var Shell = {
  isiHeader(p) {
    $('#u-nama').textContent = p.nama;
    $('#u-avatar').textContent = (p.nama || '?').trim().charAt(0).toUpperCase();
  }
};

// ---- [5e] Router: pindah halaman tanpa memuat ulang ----
var Router = {
  // diam=true: pindah tanpa spinner (dipakai setelah data baru saja dimuat di belakang layar, misal usai Selesai Perjalanan)
  pindah(nama, diam) {
    const hal = App.halaman[nama];
    if (!hal) { toast('Fitur ini belum tersedia'); return; }
    window.scrollTo(0, 0);                                       // halaman baru selalu mulai dari atas
    const mid = diam ? null : Muat.tampil();                     // spinner PERTAMA, sebelum isi halaman berganti (tidak ada kilasan)
    const lama = App.halaman[App.sekarang];
    if (lama && lama.tinggal) lama.tinggal();
    document.querySelectorAll('.halaman').forEach(e => e.hidden = e.id !== 'h-' + nama);
    document.querySelectorAll('.menu a').forEach(a => a.classList.toggle('aktif', a.dataset.hal === nama));
    tutupMenu();
    App.sekarang = nama;
    if (!hal.siap) { hal.siap = true; if (hal.init) hal.init(); } // init: sekali saja, saat pertama dibuka
    if (hal.tampil) hal.tampil();                                // tampil: setiap kali halaman dibuka
    if (mid !== null) Muat.sembunyi(mid);                        // bila halaman tidak memuat data baru, spinner hilang setelah lama minimal
  }
};

// ---- [5f] Event kerangka: klik menu, keluar, hamburger, tanggal navbar ----
document.addEventListener('click', e => {
  const a = e.target.closest('[data-hal]');
  if (a) { e.preventDefault(); Router.pindah(a.dataset.hal); }
});
// Keluar: hapus sesi lalu ganti isi halaman dengan login (tanpa pindah URL, supaya tidak diblokir browser)
$('#keluar').addEventListener('click', async () => {
  if (!(await konfirmasi('Keluar dari akun?', 'Anda perlu masuk lagi untuk membuka Portal Driver.', 'Keluar'))) return;
  const tombol = $('#keluar');
  tombol.disabled = true;
  try { sessionStorage.removeItem('sid'); } catch (e) {}
  try { await panggil('logoutUser'); } catch (e) {}
  if (UBAH_URL) { try { google.script.history.replace(null, { page: 'login' }); } catch (e) {} }
  google.script.run
    .withSuccessHandler(html => { document.open(); document.write(html); document.close(); })
    .withFailureHandler(() => { tombol.disabled = false; toast('Gagal keluar. Coba lagi.'); })
    .bukaLogin();
});
function tutupMenu() {
  $('#sisi').classList.remove('buka'); $('#tirai').classList.remove('buka');
  document.body.classList.remove('menu-buka'); $('#hamburger').setAttribute('aria-expanded', 'false');
}

  const buka = !$('#sisi').classList.contains('buka');
  $('#sisi').classList.toggle('buka', buka); $('#tirai').classList.toggle('buka', buka);
  document.body.classList.toggle('menu-buka', buka); $('#hamburger').setAttribute('aria-expanded', String(buka));
});
$('#tirai').addEventListener('click', tutupMenu);
document.addEventListener('keydown', e => { if (e.key === 'Escape') tutupMenu(); });
window.addEventListener('resize', () => { if (window.innerWidth > 900) tutupMenu(); });
$('#u-tgl').textContent = new Date().toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'short', year: 'numeric', timeZone: TZ });
